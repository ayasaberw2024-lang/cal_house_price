<!DOCTYPE html>
<html>
<head>
    <title>House Price Prediction</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 220px;
        }

        button {
            padding: 10px 20px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <h1>🏠 House Price Prediction</h1>

    <!-- Inputs (must be numbers only) -->
    <input type="number" id="MedInc" placeholder="MedInc"><br>
    <input type="number" id="HouseAge" placeholder="HouseAge"><br>
    <input type="number" id="AveRooms" placeholder="AveRooms"><br>
    <input type="number" id="AveBedrms" placeholder="AveBedrms"><br>
    <input type="number" id="Population" placeholder="Population"><br>
    <input type="number" id="AveOccup" placeholder="AveOccup"><br>
    <input type="number" id="Latitude" placeholder="Latitude"><br>
    <input type="number" id="Longitude" placeholder="Longitude"><br>

    <br>

    <button onclick="predict()">Predict</button>

    <h2 id="result">Result...</h2>

    <script>

        async function predict() {

            document.getElementById("result").innerText = "Loading...";

            // Collect features in correct order
            const features = [
                parseFloat(document.getElementById("MedInc").value),
                parseFloat(document.getElementById("HouseAge").value),
                parseFloat(document.getElementById("AveRooms").value),
                parseFloat(document.getElementById("AveBedrms").value),
                parseFloat(document.getElementById("Population").value),
                parseFloat(document.getElementById("AveOccup").value),
                parseFloat(document.getElementById("Latitude").value),
                parseFloat(document.getElementById("Longitude").value)
            ];

            try {
                // 🚨 IMPORTANT: correct API URL
                const response = await fetch(
                    "https://calhouseprice-production.up.railway.app/predict",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            features: features
                        })
                    }
                );

                const data = await response.json();

                document.getElementById("result").innerText =
                    "Prediction: " + data.prediction;

            } catch (error) {

                console.log(error);

                document.getElementById("result").innerText =
                    "Error connecting to API ❌";
            }
        }

    </script>

</body>
</html>
